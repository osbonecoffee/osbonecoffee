<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pemesanan — Os Bone Coffee</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#1A1A1A;--cream:#F5F1EB;--brown:#8B5E3C}*{box-sizing:border-box}body{background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;margin:0}.serif{font-family:Fraunces,serif}.scrollbar-none::-webkit-scrollbar{display:none}</style></head><body><div id="root"></div><script src="app-config.js"></script><script src="shared.js"></script><script>
let content=normalizeContent(clone(DEFAULT_CONTENT)),category='',cart=[],cartOpen=false,customerName='',modalItem=null,busy=false;
function drink(i){return i&&(i.category==='KOPI'||i.category==='NON-COFFEE')}function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}function count(){return cart.reduce((s,x)=>s+x.qty,0)}
function itemModal(){const i=modalItem;return `<div class="fixed inset-0 bg-black/40 z-50 flex items-end md:items-center md:justify-center"><div class="bg-white w-full md:max-w-[520px] rounded-t-[24px] md:rounded-[24px] p-6 max-h-[92vh] overflow-y-auto"><div class="flex justify-between"><div><div class="serif text-[22px] font-bold">${esc(i.name)}</div><div class="text-[12px] opacity-50">${money(i.price)}</div></div><button id="closeItem" class="w-9 h-9 rounded-full border">✕</button></div>${drink(i)?`<div class="grid grid-cols-2 gap-4 mt-5"><div><div class="text-[10px] uppercase tracking-wider font-bold opacity-45">Suhu</div><div class="flex gap-1.5 mt-2">${['Hot','Ice'].map(v=>`<button data-temp="${v}" class="flex-1 h-8 rounded-lg border text-[11px] font-medium ${i._temp===v?'bg-[var(--ink)] text-white':''}">${v}</button>`).join('')}</div></div><div><div class="text-[10px] uppercase tracking-wider font-bold opacity-45">Gula</div><div class="flex gap-1 mt-2">${['Normal','Less','No'].map(v=>`<button data-sugar="${v}" class="flex-1 h-8 rounded-lg border text-[10px] font-medium ${i._sugar===v?'bg-[var(--ink)] text-white':''}">${v==='Normal'?'Normal':v==='Less'?'Less Sugar':'No Sugar'}</button>`).join('')}</div></div></div>`:''}<div class="mt-4"><label class="text-[10px] uppercase tracking-wider font-bold opacity-45">Nama</label><input id="itemName" class="w-full h-10 rounded-[10px] border px-3 mt-1 text-[13px]" value="${esc(i._name||customerName)}" placeholder="Nama pemesan"></div><div class="mt-3"><label class="text-[10px] uppercase tracking-wider font-bold opacity-45">Catatan</label><textarea id="itemNote" class="w-full rounded-[10px] border p-3 mt-1 text-[13px]" rows="2" placeholder="Catatan khusus">${esc(i._note||'')}</textarea></div><div class="flex items-center justify-between mt-4"><b class="text-[12px]">Jumlah</b><div class="flex items-center gap-3"><button id="qtyMinus" class="w-8 h-8 rounded-full border">−</button><span class="text-[13px] font-semibold">${i._qty||1}</span><button id="qtyPlus" class="w-8 h-8 rounded-full border">+</button></div></div><button id="addItem" class="mt-5 w-full h-11 rounded-full bg-[var(--ink)] text-white text-[13px] font-semibold">Masukkan ke Keranjang</button></div></div>`}
function cartModal(){return `<div class="fixed inset-0 bg-black/40 z-50 flex items-end md:items-center md:justify-center"><div class="bg-white w-full md:max-w-[560px] rounded-t-[24px] md:rounded-[24px] p-6 max-h-[92vh] overflow-y-auto"><div class="flex justify-between"><div><div class="serif text-[22px] font-bold">Keranjang</div><div class="text-[11px] opacity-50 mt-1">${count()} item</div></div><button id="closeCart" class="w-9 h-9 rounded-full border">✕</button></div><div class="mt-4 space-y-3">${cart.map((x,i)=>`<div class="border rounded-[14px] p-3"><div class="flex justify-between gap-3"><div><div class="font-semibold text-[13px]">${esc(x.name)}</div><div class="text-[11px] opacity-55">${drink(x)?`${esc(x.temp)} · ${esc(x.sugar)} · ${esc(x.nama||customerName)}`:''}</div>${x.catatan?`<div class="text-[11px] opacity-55">Catatan: ${esc(x.catatan)}</div>`:''}</div><div class="font-bold text-[12px]">${money(x.price*x.qty)}</div></div><div class="flex justify-between items-center mt-2"><button data-remove="${i}" class="text-[11px] text-red-600">Hapus</button><div class="flex items-center gap-2"><button data-dec="${i}" class="w-7 h-7 rounded-full border">−</button><span class="text-[12px]">${x.qty}</span><button data-inc="${i}" class="w-7 h-7 rounded-full border">+</button></div></div></div>`).join('')}</div><div class="mt-5"><label class="text-[10px] uppercase tracking-wider font-bold opacity-45">Nama Pemesan</label><input id="customerName" class="w-full h-10 rounded-[10px] border px-3 mt-1 text-[13px]" value="${esc(customerName)}" placeholder="Wajib diisi"></div><div class="mt-5 border-t pt-4 flex justify-between font-bold"><span>Total</span><span>${money(total())}</span></div><button id="submitOrder" class="mt-4 w-full h-11 rounded-full bg-[var(--ink)] text-white text-[13px] font-semibold">Lanjut Pembayaran</button></div></div>`}
function paymentModal(){return `<div class="fixed inset-0 bg-black/40 z-50 flex items-end md:items-center md:justify-center"><div class="bg-white w-full md:max-w-[430px] rounded-t-[24px] md:rounded-[24px] p-6"><div class="flex justify-between"><div><div class="serif text-[22px] font-bold">Konfirmasi Pesanan</div><div class="text-[11px] opacity-50 mt-1">Pilih jenis pesanan sebelum dikirim.</div></div><button id="closePayment" class="w-9 h-9 rounded-full border">✕</button></div><div class="grid grid-cols-2 gap-2 mt-5"><button data-paytype="dine_in" class="h-11 rounded-[12px] border text-[12px] font-semibold ${orderType==='dine_in'?'bg-[var(--ink)] text-white':''}">Dine In</button><button data-paytype="take_away" class="h-11 rounded-[12px] border text-[12px] font-semibold ${orderType==='take_away'?'bg-[var(--ink)] text-white':''}">Take Away</button></div><div class="mt-5 flex justify-between border-t pt-4 font-bold"><span>Total</span><span>${money(total())}</span></div><button id="confirmSubmit" class="mt-4 w-full h-11 rounded-full bg-[var(--ink)] text-white text-[13px] font-semibold" ${busy?'disabled':''}>Kirim Pesanan ke Kasir</button></div></div>`}
let orderType='dine_in',paymentOpen=false;
function render(){category=category||(content.menu.categories[0]||'');const items=content.menu.items.filter(x=>x.category===category);document.getElementById('root').innerHTML=`<header class="sticky top-0 z-40 bg-white border-b border-black/10"><div class="max-w-[900px] mx-auto px-5 h-[68px] flex items-center"><div class="flex items-center gap-2.5">${logo(content)}<div><div class="font-bold serif">${esc(content.brand.name)}</div><div class="text-[10px] opacity-50">${esc(content.text.orderingOnlineLabel)}</div></div></div></div></header><main class="max-w-[900px] mx-auto px-5 py-6 pb-28"><div class="flex gap-2 overflow-x-auto scrollbar-none pb-2 mb-5">${content.menu.categories.map(c=>`<button data-cat="${esc(c)}" class="h-9 px-4 rounded-full border text-[11px] font-semibold whitespace-nowrap ${c===category?'bg-[var(--ink)] text-white':''}">${esc(c)}</button>`).join('')}</div><div class="grid sm:grid-cols-2 gap-4">${items.map(i=>`<article class="bg-white rounded-[18px] border overflow-hidden"><img src="${esc(i.image)}" class="w-full aspect-[4/2.7] object-cover"><div class="p-4"><div><h3 class="serif text-[18px] font-semibold">${esc(i.name)}</h3><p class="text-[12px] opacity-55 mt-1">${esc(i.desc)}</p></div><button data-add="${i.id}" class="w-full h-10 rounded-full bg-[var(--ink)] text-white text-[12px] font-semibold mt-4">+ Tambah</button></div></article>`).join('')}</div></main>${count()?`<button id="cartBar" class="fixed bottom-4 left-4 right-4 max-w-[870px] mx-auto h-14 rounded-full bg-[var(--ink)] text-white flex items-center justify-between px-5 shadow-xl z-30"><span>${count()} item</span><b>${money(total())} · Keranjang →</b></button>`:''}${modalItem?itemModal():''}${cartOpen?cartModal():''}${paymentOpen?paymentModal():''}`;bind()}
function bind(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=clone(content.menu.items.find(x=>x.id===b.dataset.add));i._qty=1;i._temp=drink(i)?'Ice':'';i._sugar=drink(i)?'Normal':'';i._name=customerName;i._note='';modalItem=i;render()});document.getElementById('closeItem')?.addEventListener('click',()=>{modalItem=null;render()});document.querySelectorAll('[data-temp]').forEach(b=>b.onclick=()=>{modalItem._temp=b.dataset.temp;render()});document.querySelectorAll('[data-sugar]').forEach(b=>b.onclick=()=>{modalItem._sugar=b.dataset.sugar;render()});document.getElementById('itemName')?.addEventListener('input',e=>modalItem._name=e.target.value);document.getElementById('itemNote')?.addEventListener('input',e=>modalItem._note=e.target.value);document.getElementById('qtyMinus')?.addEventListener('click',()=>{modalItem._qty=Math.max(1,(modalItem._qty||1)-1);render()});document.getElementById('qtyPlus')?.addEventListener('click',()=>{modalItem._qty=(modalItem._qty||1)+1;render()});document.getElementById('addItem')?.addEventListener('click',()=>{const x={menuId:modalItem.id,name:modalItem.name,category:modalItem.category,price:modalItem.price,qty:modalItem._qty||1,temp:modalItem._temp||'',sugar:modalItem._sugar||'',nama:modalItem._name||customerName,catatan:modalItem._note||''};const same=cart.find(c=>c.menuId===x.menuId&&c.temp===x.temp&&c.sugar===x.sugar&&c.nama===x.nama&&c.catatan===x.catatan);if(same)same.qty+=x.qty;else cart.push(x);modalItem=null;render()});document.getElementById('cartBar')?.addEventListener('click',()=>{cartOpen=true;render()});document.getElementById('closeCart')?.addEventListener('click',()=>{cartOpen=false;render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);render()});document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[+b.dataset.inc].qty++;render()});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dec;cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()});document.getElementById('customerName')?.addEventListener('input',e=>customerName=e.target.value);document.getElementById('submitOrder')?.addEventListener('click',()=>{customerName=document.getElementById('customerName').value.trim();if(!customerName)return alert('Nama pemesan wajib diisi.');cartOpen=false;paymentOpen=true;render()});document.getElementById('closePayment')?.addEventListener('click',()=>{paymentOpen=false;cartOpen=true;render()});document.querySelectorAll('[data-paytype]').forEach(b=>b.onclick=()=>{orderType=b.dataset.paytype;render()});document.getElementById('confirmSubmit')?.addEventListener('click',submit)}
async function submit(){if(!cart.length||!customerName)return;busy=true;render();const items=cart.map(x=>({menuId:x.menuId,name:x.name,category:x.category,price:x.price,qty:x.qty,subtotal:x.price*x.qty,temp:x.temp,sugar:x.sugar,nama:x.nama||customerName,catatan:x.catatan}));const o={id:uid(),orderType,meja:'',namaPelanggan:customerName,items,total:items.reduce((s,x)=>s+x.subtotal,0),status:'baru',bayar:'menunggu',metodeBayar:'',diskonTipe:'nominal',diskonNilai:0,diskon:0,totalBayar:items.reduce((s,x)=>s+x.subtotal,0),dibatalkan:false,sumber:'website',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const r=await addOrder(o);busy=false;cart=[];paymentOpen=false;render();alert(r.ok===false&&!r.offline?'Pesanan tersimpan di perangkat, tetapi sinkron online gagal.':'Pesanan berhasil dikirim ke kasir. Silakan bayar di kasir.')}
(async()=>{content=await loadContent();window.APP_SCRIPT_URL=content.app?.scriptUrl||localStorage.getItem('osbone_app_script_url')||'';render()})();
</script></body></html>
