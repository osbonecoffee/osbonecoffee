<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sistem Kasir — Os Bone Coffee</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#1A1A1A;--cream:#F5F1EB;--brown:#8B5E3C}*{box-sizing:border-box}body{background:#F7F5F1;color:var(--ink);font-family:Inter,sans-serif;margin:0}.serif{font-family:Fraunces,serif}.cash-input{font-variant-numeric:tabular-nums}button:disabled{opacity:.45;cursor:not-allowed}.bar{min-width:8px;transition:height .3s ease}</style></head><body><div id="root"></div><script src="app-config.js"></script><script src="shared.js"></script><script>

function cashModal(o){const d=discountAmount(o),pay=Math.max(0,o.total-d),given=Number(String(cashGiven).replace(/\D/g,''))||0,change=given-pay;return `<div id="payModal" class="fixed inset-0 bg-black/40 z-[60] flex items-end md:items-center md:justify-center p-0 md:p-5"><div class="bg-white w-full md:max-w-[500px] rounded-t-[24px] md:rounded-[24px] p-6 max-h-[94vh] overflow-y-auto"><div class="flex justify-between"><div><div class="serif text-[22px] font-bold">Pembayaran</div><div class="text-[11px] opacity-50">${esc(o.namaPelanggan||'Pelanggan')} · ${esc(o.id)}</div></div><button id="closePay" class="w-9 h-9 rounded-full border">✕</button></div><div class="grid grid-cols-2 gap-2 mt-5"><button data-method="Tunai" class="h-10 rounded-full text-[12px] font-semibold ${payMethod==='Tunai'?'bg-[var(--ink)] text-white':'border'}">Tunai</button><button data-method="QRIS" class="h-10 rounded-full text-[12px] font-semibold ${payMethod==='QRIS'?'bg-[var(--ink)] text-white':'border'}">QRIS</button></div><div class="mt-5 rounded-[14px] bg-[var(--cream)] p-4 space-y-2 text-[12px]"><div class="flex justify-between"><span>Subtotal</span><b>${money(o.total)}</b></div><div class="grid grid-cols-[1fr_150px] gap-2 items-center"><select id="discountType" class="h-10 border rounded-[10px] px-3 text-[12px]"><option value="percent" ${discountType==='percent'?'selected':''}>Diskon persen (%)</option><option value="nominal" ${discountType==='nominal'?'selected':''}>Diskon nominal (Rp)</option></select><input id="discountValue" inputmode="decimal" type="number" min="0" max="${discountType==='percent'?100:o.total}" value="${esc(discountValue)}" class="cash-input h-10 border rounded-[10px] px-3 text-right bg-white" placeholder="0"></div><div class="flex justify-between text-green-700"><span>Potongan</span><b id="discountAmount">− ${money(d)}</b></div><div class="flex justify-between pt-3 border-t text-[17px] font-bold"><span>Total Bayar</span><span id="payTotal">${money(pay)}</span></div></di function chart(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10),rev=orders.filter(o=>o.bayar==='lunas'&&!o.dibatalkan&&String(o.createdAt).slice(0,10)===key).reduce((s,o)=>s+Number(o.totalBayar??o.total)||0,0);days.push({label:d.toLocaleDateString('id-ID',{weekday:'short'}),rev})}const max=Math.max(1,...days.map(x=>x.rev));return `<div class="bg-white rounded-[16px] border p-4 mb-5"><div class="flex justify-between items-center mb-5"><div><b class="serif">Grafik Penjualan</b><div class="text-[10px] opacity-50">Pendapatan 7 hari terakhir</div></div></div><div class="h-[170px] flex items-end gap-2 md:gap-4">${days.map(x=>`<div class="flex-1 h-full flex flex-col justify-end items-center gap-2"><div class="text-[9px] opacity-50">${x.rev?money(x.rev).replace('Rp',''):''}</div><div class="bar w-full max-w-[44px] rounded-t-[8px] bg-[var(--brown)]" style="height:${Math.max(4,x.rev/max*115)}px" title="${money(x.rev)}"></div><div class="text-[9px] opacity-60">${x.label}</div></div>`).join('')}</div></div>`}
function exportExcel(){const now=new Date();let start,end,label;if(exportPeriod==='day'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate());end=new Date(start);end.setDate(end.getDate()+1);label='hari'}else if(exportPeriod==='year'){start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear()+1,0,1);label='tahun'}else{start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,1);label='bulan'}const data=orders.filter(o=>{const d=new Date(o.createdAt);return d>=start&&d<end&&!o.dibatalkan});let rows='';data.forEach(o=>(o.items||[]).forEach(i=>{rows+=`<tr><td>${esc(o.id)}</td><td>${new Date(o.createdAt).toLocaleString('id-ID')}</td><td>${esc(o.namaPelanggan||'Pelanggan')}</td><td>${o.orderType==='dine_in'?'Dine In':'Take Away'}</td><td>${esc(i.name)}</td><td>${i.qty}</td><td>${i.price}</td><td>${i.subtotal||i.price*i.qty}</td><td>${o.diskon||0}</td><td>${o.totalBayar??o.total}</td><td>${esc(o.metodeBayar||'')}</td><td>${o.bayar==='lunas'?'Lunas':'Menunggu'}</td></tr>`}));const html=`<html><head><meta charset="UTF-8"></head><body><h2>Os Bone Coffee — Transaksi ${label}</h2><table border="1"><thead><tr><th>ID</th><th>Waktu</th><th>Pelanggan</th><th>Tipe</th><th>Menu</th><th>Qty</th><th>Harga</th><th>Subtotal Item</th><th>Diskon Order</th><th>Total Bayar</th><th>Metode</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;const blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`os-bone-transaksi-${label}-${now.toISOString().slice(0,10)}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){const a=orders.filter(o=>today(o.createdAt)&&!o.dibatalkan),menuSales={};a.filter(o=>o.bayar==='lunas').forEach(o=>(o.items||[]).forEach(i=>menuSales[i.name]=(menuSales[i.name]||0)+(Number(i.qty)||0)));const topSales=Object.entries(menuSales).sort((x,y)=>y[1]-x[1]).slice(0,8),revenue=a.filter(o=>o.bayar==='lunas').reduce((s,o)=>s+(Number(o.totalBayar??o.total)||0),0),sold=soldCount(a),{active,hist}=lists();document.getElementById('root').innerHTML=`<header class="sticky top-0 z-30 bg-white border-b"><div class="max-w-[1400px] mx-auto px-5 md:px-8 h-auto min-h-[72px] py-3 flex flex-wrap gap-3 justify-between items-center"><div class="flex gap-3 items-center">${logo(content,'w-11 h-11')}<div><div class="font-bold serif">Kasir</div><div class="text-[11px] opacity-50">${esc(content.brand.name)}</div></div></div><div class="absolute left-1/2 -translate-x-1/2 hidden md:block text-center"><div id="clock" class="serif text-[22px] font-bold">--:--:--</div><div class="text-[9px] uppercase tracking-wider opacity-45">Waktu Kasir</div></div><div class="flex items-center gap-2 ml-auto"><button id="cashierToggle" class="h-10 px-4 rounded-full text-[11px] font-semibold ${cashierOpen?'bg-green-600 text-white':'bg-red-600 text-white'}">Kasir ${cashierOpen?'BUKA':'TUTUP'}</button><button id="manualBtn" class="h-10 px-4 rounded-full bg-[var(--ink)] text-white text-[12px] font-semibold">+ Pesanan Manual</button></div></div></header><main class="max-w-[1400px] mx-auto px-5 md:px-8 py-6"><div class="md:hidden text-center mb-4"><div id="clockMobile" class="serif text-[22px] font-bold">--:--:--</div><div class="text-[9px] uppercase tracking-wider opacity-45">Waktu Kasir</div></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5"><div class="bg-white rounded-[16px] border p-4"><div class="text-[11px] opacity-50">Pendapatan Hari Ini</div><div class="serif text-[24px] font-bold">${money(revenue)}</div></div><div class="bg-white rounded-[16px] border p-4"><div class= function updateClock(){const s=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.querySelectorAll('#clock,#clockMobile').forEach(e=>e.textContent=s)}
function bind(){document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{selected=b.dataset.order;render()});document.getElementById('search')?.addEventListener('input',e=>{search=e.target.value;refreshSearch()});document.getElementById('exportPeriod')?.addEventListener('change',e=>exportPeriod=e.target.value);document.getElementById('exportExcel')?.addEventListener('click',exportExcel);document.getElementById('cashierToggle')?.addEventListener('click',()=>{cashierOpen=!cashierOpen;localStorage.setItem('osbone_cashier_open',cashierOpen);render()});document.getElementById('manualBtn')?.addEventListener('click',()=>{if(!cashierOpen)return alert('Kasir sedang ditutup. Buka kasir terlebih dahulu.');manualOpen=true;manualCategory=manualCategory||content.menu.categories[0];manualCart=[];render()});document.getElementById('closeManual')?.addEventListener('click',()=>{manualOpen=false;render()});document.querySelectorAll('[data-mcat]').forEach(b=>b.onclick=()=>{manualCategory=b.dataset.mcat;render()});document.querySelectorAll('[data-madd]').forEach(b=>b.onclick=()=>{const i=content.menu.items.find(x=>x.id===b.dataset.madd);if(i){const x=manualCart.find(y=>y.id===i.id);if(x)x.qty++;else manualCart.push({...i,qty:1});render()}});document.getElementById('submitManual')?.addEventListener('click',async()=>{if(!manualCart.length)return alert('Tambahkan menu.');const name=document.getElementById('mName').value.trim(),items=manualCart.map(i=>({menuId:i.id,name:i.name,category:i.category,price:i.price,qty:i.qty,subtotal:i.price*i.qty,temp:'',sugar:'',nama:name,catatan:''})),t=items.reduce((a,i)=>a+i.subtotal,0);await addOrder({id:uid(),orderType:'take_away',meja:'',namaPelanggan:name||'Pelanggan',items,total:t,status:'baru',bayar:'menunggu',metodeBayar:'',diskon:0,totalBayar:t,diskonTipe:'nominal',diskonNilai:0,dibatalkan:false,sumber:'kasir',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});orders=await loadOrders();manualOpen=false;render()});document.getElementById('closeDetail')?.addEventListener('click',()=>{selected=null;render()});document.querySelector('[data-openpay]')?.addEventListener('click',()=>{if(!cashierOpen)return alert('Kasir sedang ditutup.');const o=orders.find(x=>x.id===selected);discountType=o?.diskonTipe||'percent';discountValue=o?.diskonNilai||0;cashGiven='';payMethod='Tunai';payOpen=true;render()});document.getElementById('closePay')?.addEventListener('click',()=>{payOpen=false;render()});document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{payMethod=b.dataset.method;updatePaymentMethodUI()});document.getElementById('discountType')?.addEventListener('change',e=>{discountType=e.target.value;discountValue=Math.min(Number(discountValue)||0,discountType==='percent'?100:orders.find(x=>x.id===selected)?.total||0);updatePayUI()});document.getElementById('discountValue')?.addEventListener('input',e=>{discountValue=Math.max(0,Number(e.target.value)||0);if(discountType==='percent')discountValue=Math.min(100,discountValue);else{const o=orders.find(x=>x.id===selected);discountValue=Math.min(subtotal(o),discountValue)}updatePayUI()});document.getElementById('cash')?.addEventListener('input',e=>{cashGiven=e.target.value.replace(/\D/g,'');e.target.value=cashGiven;updatePayUI()});document.querySelectorAll('[data-denom]').forEach(b=>b.onclick=()=>{cashGiven=b.dataset.denom;const e=document.getElementById('cash');if(e)e.value=cashGiven;updatePayUI()});document.getElementById('confirmPay')?.addEventListener('click',async()=>{const o=orders.find(x=>x.id===selected),d=discountAmount(o),pay=o.total-d;if(payMethod==='QRIS'){if(!confirm(`Konfirmasi pembayaran QRIS ${money(pay)}?`))return;await patchOrder(o.id,{bayar:'lunas',metodeBayar:'QRIS',diskonTipe:discountType,diskonNilai:discountValue,diskon:d,totalBayar:pay,status:'selesai',dibayarAt:new Date().toISOString()})}else{const v=Number(String(cashGiven).replace(/\D/g,''))||0;if(v<pay)return alert('Nominal pembayaran kurang.');await patchOrder(o.id,{bayar:'lunas',metodeBayar:'Tunai',uangDiterima:v,kembalian:v-pay,diskonTipe:discountType,diskonNilai:discountValue,diskon:d,totalBayar:pay,status:'selesai',dibayarAt:new Date().toISOString()});alert(`Pembayaran berhasil. Kembalian ${money(v-pay)}.`)}orders=await loadOrders();payOpen=false;render()});document.getElementById('print')?.addEventListener('click',()=>printReceipt(orders.find(x=>x.id===selected)))}
function updatePaymentMethodUI(){const modal=document.getElementById('payModal');if(!modal)return;const o=orders.find(x=>x.id===selected);const was=document.activeElement?.id==='discountValue';const value=document.getElementById('discountValue')?.value||discountValue;payMethod=payMethod;modal.querySelectorAll('[data-method]').forEach(b=>{b.className=`h-10 rounded-full text-[12px] font-semibold ${b.dataset.method===payMethod?'bg-[var(--ink)] text-white':'border'}`});const old=modal.querySelector('.mt-4.rounded-\[14px\]');if(old)old.remove();render();if(was){const e=document.getElementById('discountValue');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
function refreshSearch(){const q=search.trim().toLowerCase();document.querySelectorAll('[data-order]').forEach(b=>{const o=orders.find(x=>x.id===b.dataset.order),hay=`${o?.id} ${o?.namaPelanggan||''} ${(o?.items||[]).map(i=>i.name).join(' ')}`.toLowerCase();b.style.display=!q||hay.includes(q)?'':'none'})}
function printReceipt(o){if(!o)return;const rows=(o.items||[]).map(i=>`<tr><td>${esc(i.name)}<br><small>${i.qty} × ${money(i.price)}${i.temp?' · '+esc(i.temp):''}${i.sugar?' · '+esc(i.sugar):''}</small></td><td style="text-align:right">${money(i.subtotal||i.price*i.qty)}</td></tr>`).join('');const html=`<!doctype html><html><head><meta charset="UTF-8"><title>Struk ${esc(o.id)}</title><style>body{font-family:Arial,sans-serif;width:320px;margin:0 auto;font-size:12px;color:#111}h2{text-align:center;margin:0 0 4px}p{margin:3px 0;color:#555}hr{border:0;border-top:1px dashed #999;margin:12px 0}table{width:100%;border-collapse:collapse}td{padding:5px 0;vertical-align:top}small{color:#666}.total td{font-weight:bold;font-size:14px}.center{text-align:center}</style></head><body><h2>${esc(content.brand.name)}</h2><p class="center">${esc(o.id)}</p><p class="center">${new Date(o.createdAt).toLocaleString('id-ID')}<br>${esc(o.namaPelanggan||'Pelanggan')} · ${o.orderType==='dine_in'?'Dine In':'Take Away'}</p><hr><table>${rows}</table><hr><table><tr><td>Subtotal</td><td style="text-align:right">${money(o.total)}</td></tr><tr><td>Diskon ${o.diskonTipe==='percent'?`(${o.diskonNilai||0}%)`:''}</td><td style="text-align:right">− ${money(o.diskon||0)}</td></tr><tr class="total"><td>Total Bayar</td><td style="text-align:right">${money(o.totalBayar??o.total)}</td></tr>${o.metodeBayar?`<tr><td>Metode</td><td style="text-align:right">${esc(o.metodeBayar)}</td></tr>`:''}${o.metodeBayar==='Tunai'?`<tr><td>Diterima</td><td style="text-align:right">${money(o.uangDiterima||0)}</td></tr><tr><td>Kembalian</td><td style="text-align:right">${money(o.kembalian||0)}</td></tr>`:''}</table><hr><p class="center">Terima kasih. Sampai jumpa kembali.</p></body></html>`;const w=window.open('','_blank','width=420,height=720');if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),250)}}
(async()=>{content=await loadContent();window.APP_SCRIPT_URL=content.app?.scriptUrl||localStorage.getItem('osbone_app_script_url')||'';orders=await loadOrders();render()})();setInterval(updateClock,1000);setInterval(async()=>{orders=await loadOrders();if(!payOpen&&!selected)render()},5000);
</script></body></html>
