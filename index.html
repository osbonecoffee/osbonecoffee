<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Os Bone Coffee</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#1A1A1A;--cream:#F5F1EB;--brown:#8B5E3C;--tan:#C7A17A}*{box-sizing:border-box}body{background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;margin:0}.serif{font-family:Fraunces,serif}.scrollbar-none::-webkit-scrollbar{display:none}</style></head><body><div id="root"></div><script src="app-config.js"></script><script src="shared.js"></script><script>
let content=normalizeContent(clone(DEFAULT_CONTENT)),cat='';
function wrap(){return `max-width:${Number(content.design.containerWidth)||1280}px`}
function render(){
 cat=cat||(content.menu.categories[0]||'');
 const items=content.menu.items.filter(i=>i.category===cat), d=content.design, gap=Math.max(32,Number(d.sectionSpacing)||96);
 document.getElementById('root').innerHTML=`
<header class="sticky top-0 z-40 bg-[var(--cream)]/90 backdrop-blur border-b border-black/5"><div style="${wrap()};height:${Number(d.headerHeight)||76}px" class="mx-auto px-5 md:px-8 flex items-center justify-between gap-6"><div class="flex items-center gap-3">${logo(content,`w-[${Number(d.logoDesktop)||52}px] h-[${Number(d.logoDesktop)||52}px] max-md:w-[${Number(d.logoMobile)||44}px] max-md:h-[${Number(d.logoMobile)||44}px]`)}<div class="leading-none"><div class="font-bold serif text-[18px]">${esc(content.brand.name)}</div><div class="text-[10px] tracking-[.18em] opacity-50 mt-1">${esc(content.brand.sub)}</div></div></div><nav class="flex items-center gap-4 sm:gap-6 text-[11px] sm:text-[12px] font-semibold overflow-x-auto whitespace-nowrap scrollbar-none max-w-[52%] sm:max-w-none">${content.nav.map(n=>`<a href="${esc(n.href)}" class="opacity-70 hover:opacity-100">${esc(n.label)}</a>`).join('')}</nav></div></header>
<section id="beranda" style="padding-top:${gap*.58}px;padding-bottom:${gap*.58}px"><div style="${wrap()}" class="mx-auto px-5 md:px-8"><div class="grid lg:grid-cols-[1.05fr_.95fr] gap-10 md:gap-16 items-center"><div><div class="inline-flex px-3 py-1.5 rounded-full bg-white border border-black/10 text-[11px] font-semibold">${esc(content.hero.badgeText)}</div><h1 class="serif text-[56px] md:text-[82px] leading-[.88] tracking-[-.04em] font-bold mt-5">${esc(content.hero.titleLine1)} <span class="text-[var(--brown)]">${esc(content.hero.titleHighlight)}</span><br>${esc(content.hero.titleLine2)}<br>${esc(content.hero.titleLine3)}</h1><p class="mt-7 text-[16px] md:text-[17px] leading-[1.75] opacity-70 max-w-[60ch]">${esc(content.hero.desc)}</p></div><div class="rounded-[28px] overflow-hidden aspect-[4/4.3] bg-[#EFE8DE]"><img src="${esc(content.hero.image)}" class="w-full h-full object-cover"></div></div></div></section>
<section id="tentang" class="bg-white border-y border-black/5"><div style="${wrap()};padding-top:${gap}px;padding-bottom:${gap}px" class="mx-auto px-5 md:px-8 grid md:grid-cols-[.9fr_1.1fr] gap-10 md:gap-16"><div><div class="text-[12px] tracking-[.22em] uppercase font-bold opacity-50 mb-4">${esc(content.about.eyebrow)}</div><h2 class="serif text-[36px] md:text-[48px] leading-[.95] font-bold">${esc(content.about.heading1)}<br>${esc(content.about.heading2)}<br>${esc(content.about.heading3)}</h2><div class="mt-8 grid grid-cols-3 gap-6 border-t pt-6 max-w-[380px]">${content.about.stats.map(s=>`<div><div class="serif text-[28px] font-bold">${esc(s.value)}</div><div class="text-[12px] opacity-60">${esc(s.label)}</div></div>`).join('')}</div></div><div class="space-y-6 text-[16px] leading-[1.75] opacity-80"><p>${esc(content.about.paragraph1)}</p><p>${esc(content.about.paragraph2)}</p><div class="rounded-[20px] bg-[var(--cream)] p-6"><div class="serif text-[20px] font-semibold">"${esc(content.about.quote)}"</div><div class="mt-3 text-[13px] opacity-60">${esc(content.about.quoteBy)}</div></div></div></div></section>
<section id="menu" style="padding-top:${gap}px;padding-bottom:${gap}px"><div style="${wrap()}" class="mx-auto px-5 md:px-8"><div class="mb-8"><div class="text-[12px] tracking-[.22em] uppercase font-bold opacity-50 mb-3">${esc(content.text.menuEyebrow)}</div><h2 class="serif text-[36px] md:text-[56px] leading-[.9] font-bold">${esc(content.text.menuHeading1)}<br>${esc(content.text.menuHeading2)}</h2></div><div class="flex gap-2 overflow-x-auto scrollbar-none pb-2">${content.menu.categories.map(k=>`<button data-cat="${esc(k)}" class="h-10 px-5 rounded-full border text-[13px] font-semibold ${k===cat?'bg-[var(--ink)] text-white border-[var(--ink)]':'bg-white border-black/10'}">${esc(k)}</button>`).join('')}</div><div class="mt-8 grid sm:grid-cols-2 lg:grid-cols-${Math.min(4,Math.max(1,Number(d.menuColumns)||3))} gap-5">${items.map(i=>`<article style="border-radius:${Number(d.cardRadius)||22}px" class="bg-white border border-black/5 overflow-hidden"><img src="${esc(i.image)}" class="w-full aspect-[4/2.8] object-cover"><div class="p-5"><h3 class="serif text-[18px] font-semibold">${esc(i.name)}</h3><p class="mt-2 text-[13px] opacity-60 min-h-[42px]">${esc(i.desc)}</p></div></article>`).join('')}</div></div></section>
<section id="galeri" class="bg-[var(--ink)] text-[var(--cream)]"><div style="${wrap()};padding-top:${gap}px;padding-bottom:${gap}px" class="mx-auto px-5 md:px-8"><div class="mb-10"><div class="text-[12px] tracking-[.22em] uppercase font-bold opacity-50 mb-3">${esc(content.text.galleryEyebrow)}</div><h2 class="serif text-[36px] md:text-[48px] font-bold">${esc(content.text.galleryHeading1)}<br>${esc(content.text.galleryHeading2)}</h2></div><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${content.gallery.map(g=>`<img src="${esc(g)}" class="w-full aspect-square object-cover rounded-[18px]">`).join('')}</div></div></section>
<section id="lokasi" style="padding-top:${gap}px;padding-bottom:${gap}px"><div style="${wrap()}" class="mx-auto px-5 md:px-8"><div class="grid lg:grid-cols-2 gap-10"><div><div class="text-[12px] tracking-[.22em] uppercase font-bold opacity-50 mb-3">${esc(content.text.locationEyebrow)}</div><h2 class="serif text-[36px] md:text-[48px] leading-[.9] font-bold">${esc(content.location.heading1)}<br>${esc(content.location.heading2)}</h2><div class="mt-8 space-y-5 text-[14px]"><div>📍 ${esc(content.location.address)}<br>${esc(content.location.addressCity)}<br><span class="opacity-50">${esc(content.location.addressNote)}</span></div><div>⏰ ${esc(content.location.hours1)}<br>${esc(content.location.hours2)}</div><div>📸 <a class="underline" href="${esc(content.location.instagramLink)}" target="_blank">${esc(content.location.instagram)}</a></div></div></div></div></div></section><footer class="border-t border-black/10 py-8"><div style="${wrap()}" class="mx-auto px-5 md:px-8 text-[13px] opacity-60">${esc(content.text.footerText).replace('{year}',new Date().getFullYear()).replace('{brand}',content.brand.name)}</div></footer>`;
 document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});
}
(async()=>{content=await loadContent();window.APP_SCRIPT_URL=content.app?.scriptUrl||localStorage.getItem('osbone_app_script_url')||'';render()})();setInterval(async()=>{const c=await loadContent();if(JSON.stringify(c)!==JSON.stringify(content)){content=c;render()}},8000);
</script></body></html>
